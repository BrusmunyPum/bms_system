spring:
  application:
    name: bms-api
  datasource:
    url: ${BMS_DB_URL:jdbc:postgresql://localhost:5432/bms_dev}
    username: ${BMS_DB_USERNAME:postgres}
    password: ${BMS_DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
